name: Build Call

# Pure Messenger Call (Electron / Chromium). Manual only, to save Actions minutes; macOS runners
# count 10x. A run started on a v* tag publishes the bundles to a draft GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-22.04
            args: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci
      - run: node --test ../src-tauri/inject/inject.test.mjs
      - run: npm run build -- ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: PureMessengerCall-${{ matrix.name }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm

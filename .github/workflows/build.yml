name: Build Lite

# Manual only (Actions tab → Build → Run workflow), to save Actions minutes; macOS runners count
# 10x. A run started on a v* tag publishes the bundles to a draft GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # signs the build provenance attestations
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            out: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            out: src-tauri/target/release/bundle
          - name: Ubuntu
            os: ubuntu-22.04
            args: --bundles appimage,deb
            out: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build ${{ matrix.args }}

      # Each file gets a .sha256 next to it and a signed build provenance attestation, so anyone can
      # check a download came from this repository: `gh attestation verify <file> --repo bthanhtung/natter`.
      - name: Checksums
        shell: bash
        working-directory: ${{ matrix.out }}
        run: |
          for f in dmg/*.dmg nsis/*.exe msi/*.msi appimage/*.AppImage deb/*.deb; do
            [ -f "$f" ] || continue
            (cd "$(dirname "$f")" && b="$(basename "$f")" && { sha256sum "$b" 2>/dev/null || shasum -a 256 "$b"; } > "$b.sha256")
          done

      # Attestations need a public repository on GitHub's free plans.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/deb/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Natter-Lite-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/dmg/*.dmg.sha256
            ${{ matrix.out }}/nsis/*.exe.sha256
            ${{ matrix.out }}/msi/*.msi.sha256
            ${{ matrix.out }}/appimage/*.AppImage.sha256
            ${{ matrix.out }}/deb/*.deb.sha256
          if-no-files-found: error

      # A v* tag publishes the bundles to a draft GitHub Release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/dmg/*.dmg.sha256
            ${{ matrix.out }}/nsis/*.exe.sha256
            ${{ matrix.out }}/msi/*.msi.sha256
            ${{ matrix.out }}/appimage/*.AppImage.sha256
            ${{ matrix.out }}/deb/*.deb.sha256

  # The .rpm is built on Fedora itself so it links against Fedora's own libraries.
  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y git nodejs npm gcc gcc-c++ make curl wget file rpm-build \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles rpm

      # Each file gets a .sha256 next to it and a signed build provenance attestation, so anyone can
      # check a download came from this repository: `gh attestation verify <file> --repo bthanhtung/natter`.
      - name: Checksums
        shell: bash
        working-directory: src-tauri/target/release/bundle/rpm
        run: |
          for f in *.rpm; do
            [ -f "$f" ] || continue
            (cd "$(dirname "$f")" && b="$(basename "$f")" && { sha256sum "$b" 2>/dev/null || shasum -a 256 "$b"; } > "$b.sha256")
          done

      # Attestations need a public repository on GitHub's free plans.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            src-tauri/target/release/bundle/rpm/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: Natter-Lite-Fedora
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sha256
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sha256

  # Tauri has no Arch bundle, so the package is built on Arch itself from the files of its .deb bundle.
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed git base-devel nodejs npm curl wget file openssl \
            webkit2gtk-4.1 libayatana-appindicator librsvg xdotool

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles deb

      # makepkg refuses to run as root.
      - name: Package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging/arch && makepkg --nodeps"

      - name: Checksums
        working-directory: packaging/arch
        run: |
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      # Attestations need a public repository on GitHub's free plans.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            packaging/arch/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: Natter-Lite-Arch
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/*.pkg.tar.zst.sha256
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/*.pkg.tar.zst.sha256

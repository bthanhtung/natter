name: Build

# Manual only (Actions tab → Build → Run workflow), to save Actions minutes; macOS runners count
# 10x. A run started on a v* tag publishes the bundles to a draft GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            out: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            out: src-tauri/target/release/bundle
          - name: Ubuntu
            os: ubuntu-22.04
            args: --bundles appimage,deb
            out: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: PureMessenger-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/deb/*.deb
          if-no-files-found: error

      # A v* tag publishes the bundles to a draft GitHub Release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/deb/*.deb

  # The .rpm is built on Fedora itself so it links against Fedora's own libraries.
  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y git nodejs npm gcc gcc-c++ make curl wget file rpm-build \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles rpm

      - uses: actions/upload-artifact@v4
        with:
          name: PureMessenger-Fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: src-tauri/target/release/bundle/rpm/*.rpm

name: Idea or feature request
description: Suggest something that would make Natter better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Natter stays a window around Meta's own Messenger page: no unofficial APIs, scraping or automation
        (see [CONTRIBUTING](https://github.com/bthanhtung/natter/blob/main/CONTRIBUTING.md#the-one-rule)).
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      placeholder: "I'd like to mute a chat from the tray menu."
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.

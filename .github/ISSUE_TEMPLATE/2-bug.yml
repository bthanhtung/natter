name: Bug report
description: Something in Natter itself doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Please don't include anyone's messages, names or photos in screenshots.**"
  - type: dropdown
    id: app
    attributes:
      label: App
      options: ["Natter (Chromium)", "Natter Lite"]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "macOS 26.1 (Apple silicon), Windows 11 24H2, Ubuntu 24.04…"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Preferences
        2. Turn on Glass effect
        3. …
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations: { required: true }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preferences</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f0f2f5; --card: #fff; --text: #050505; --muted: #65676b;
    --line: #dddfe2; --accent: #0866ff; --knob: #fff; --off: #bcc0c4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18191a; --card: #242526; --text: #e4e6eb; --muted: #b0b3b8; --line: #3e4042; --off: #4e4f50; }
  }
  /* macOS: the title bar is overlaid, so the page starts below it; with glass it is translucent. */
  html.mac body { padding-top: 40px; }
  html.mac .card { border-radius: 14px; }
  html:not(.mac) .mac-only { display: none; }
  html.glass { --bg: transparent; --card: rgba(255, 255, 255, .55); --line: rgba(0, 0, 0, .1); }
  @media (prefers-color-scheme: dark) {
    html.glass { --card: rgba(255, 255, 255, .07); --line: rgba(255, 255, 255, .1); }
  }
  html.glass .card { box-shadow: inset 0 0 0 .5px var(--line); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 20px 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  h2 { margin: 18px 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  h2:first-child { margin-top: 0; }
  .card { background: var(--card); border-radius: 10px; padding: 4px 14px; }
  .themes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 12px 0 10px; }
  .themes label { display: grid; justify-items: center; gap: 6px; font-size: 12px; text-align: center; cursor: pointer; }
  .themes input { position: absolute; opacity: 0; pointer-events: none; }
  .swatch { width: 100%; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .swatch i { width: 60%; height: 22%; border-radius: 999px; }
  .themes input:checked + .swatch { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .themes input:focus-visible + .swatch { outline: 2px solid var(--accent); outline-offset: 2px; }
  .s-facebook { background: linear-gradient(135deg, #fff 50%, #242526 50%); }
  .s-facebook i { background: #0866ff; width: 34%; height: 34%; border-radius: 50%; }
  .s-system { background: linear-gradient(135deg, #fff 50%, #242526 50%); }
  .s-system i { background: #0866ff; }
  .s-light { background: #fff; } .s-light i { background: #e4e6eb; }
  .s-grey { background: #242526; } .s-grey i { background: #3a3b3c; }
  .s-dark { background: #000; } .s-dark i { background: #1c1c1d; }
  .s-high_contrast { background: #fff; border-color: #000; } .s-high_contrast i { background: #000; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .switch { position: relative; flex: none; width: 40px; height: 24px; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--off); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .button { appearance: none; border: 0; border-radius: 8px; padding: 7px 14px; background: var(--off); color: var(--text); font: inherit; cursor: pointer; }
  .button.confirm { background: #e41e3f; color: #fff; }
  .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 18px; margin: 12px 4px 0; font-size: 12px; color: var(--muted); }
  #status.error { color: #e41e3f; }
</style>
</head>
<body>
<form id="form">
  <h2>Appearance</h2>
  <div class="card">
    <div class="themes" role="radiogroup" aria-label="Theme">
      <label><input type="radio" name="theme" value="facebook"><span class="swatch s-facebook"><i></i></span>Facebook</label>
      <label><input type="radio" name="theme" value="system"><span class="swatch s-system"><i></i></span>System</label>
      <label><input type="radio" name="theme" value="light"><span class="swatch s-light"><i></i></span>Light</label>
      <label><input type="radio" name="theme" value="grey"><span class="swatch s-grey"><i></i></span>Grey</label>
      <label><input type="radio" name="theme" value="dark"><span class="swatch s-dark"><i></i></span>Dark</label>
      <label><input type="radio" name="theme" value="high_contrast"><span class="swatch s-high_contrast"><i></i></span>High contrast</label>
    </div>
  </div>

  <h2>Notifications</h2>
  <div class="card">
    <label class="row"><span>Do not disturb<small>Mute all desktop notifications</small></span><span class="switch"><input type="checkbox" name="doNotDisturb"><span></span></span></label>
    <label class="row"><span>Show previews<small>Show message text in notifications</small></span><span class="switch"><input type="checkbox" name="showPreviews"><span></span></span></label>
    <label class="row"><span>Notification sounds</span><span class="switch"><input type="checkbox" name="sounds"><span></span></span></label>
  </div>

  <h2>General</h2>
  <div class="card">
    <label class="row"><span>Open at login</span><span class="switch"><input type="checkbox" name="launchAtLogin"><span></span></span></label>
    <label class="row"><span>Keep running when closed<small>Closing the window hides it to the tray instead of quitting</small></span><span class="switch"><input type="checkbox" name="closeToTray"><span></span></span></label>
    <label class="row mac-only"><span>Glass effect<small>Translucent window. Uses more graphics power; applies after restarting PureMessenger</small></span><span class="switch"><input type="checkbox" name="glass"><span></span></span></label>
  </div>
  <h2>Account</h2>
  <div class="card">
    <div class="row"><span>Sign out of Facebook<small>Removes the session from this computer</small></span><button type="button" class="button" id="sign-out">Sign Out</button></div>
  </div>
  <p id="status" role="status"></p>
</form>
<script>
  "use strict";
  if (/Mac/.test(navigator.platform)) document.documentElement.classList.add("mac");
  if (new URLSearchParams(location.search).has("glass")) document.documentElement.classList.add("glass");
  const form = document.getElementById("form");
  const status = document.getElementById("status");
  const toggles = ["doNotDisturb", "showPreviews", "sounds", "closeToTray", "glass", "launchAtLogin"];

  function invoke(command, args) {
    const bridge = window.__TAURI_INTERNALS__;
    return bridge ? bridge.invoke(command, args) : Promise.reject(new Error("unavailable"));
  }

  function render(preferences) {
    const theme = form.querySelector(`input[name="theme"][value="${preferences.theme}"]`);
    if (theme) theme.checked = true;
    for (const name of toggles) form.elements[name].checked = !!preferences[name];
    form.elements.showPreviews.disabled = form.elements.sounds.disabled = !!preferences.doNotDisturb;
  }

  function collect() {
    return {
      settings: {
        theme: form.elements.theme.value || "facebook",
        doNotDisturb: form.elements.doNotDisturb.checked,
        showPreviews: form.elements.showPreviews.checked,
        sounds: form.elements.sounds.checked,
        closeToTray: form.elements.closeToTray.checked,
        glass: form.elements.glass.checked
      },
      launchAtLogin: form.elements.launchAtLogin.checked
    };
  }

  form.addEventListener("change", () => {
    status.className = "";
    status.textContent = "";
    invoke("set_preferences", collect()).then(render, error => {
      status.className = "error";
      status.textContent = `Could not save: ${error}`;
      invoke("get_preferences").then(render, () => {});
    });
  });
  form.addEventListener("submit", event => event.preventDefault());

  // Two clicks: the first arms the button for a few seconds, the second signs out.
  const signOut = document.getElementById("sign-out");
  let armed;
  signOut.addEventListener("click", () => {
    if (!armed) {
      signOut.textContent = "Click to Confirm";
      signOut.classList.add("confirm");
      armed = setTimeout(() => {
        armed = undefined;
        signOut.textContent = "Sign Out";
        signOut.classList.remove("confirm");
      }, 4000);
      return;
    }
    clearTimeout(armed);
    armed = undefined;
    signOut.disabled = true;
    invoke("sign_out").then(() => {
      signOut.textContent = "Signed Out";
      status.className = "";
      status.textContent = "Sign in again in the PureMessenger window.";
    }, error => {
      signOut.disabled = false;
      signOut.textContent = "Sign Out";
      signOut.classList.remove("confirm");
      status.className = "error";
      status.textContent = `Could not sign out: ${error}`;
    });
  });

  invoke("get_preferences").then(render, () => {
    status.className = "error";
    status.textContent = "Preferences are unavailable.";
  });
</script>
</body>
</html>
